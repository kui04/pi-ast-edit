name: checks

# CI entry (push/PR) and shared check suite, called by release.yml as a
# publish gate. Single source of truth — do not duplicate these steps.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  # Called by release.yml as a gate before publishing.
  workflow_call:
concurrency:
  # NB: github.workflow resolves to the CALLER's workflow name when this
  # file runs via workflow_call, so a generic group would collide with the
  # caller's concurrency group and deadlock (GH discussion #30708).
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain (channel from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dev dependencies
        run: npm ci
      - name: Typecheck extension
        run: npx tsc --noEmit
      - name: Biome check
        run: npx @biomejs/biome ci --error-on-warnings .
      # Debug build; also produces target/debug/pi-ast-edit for the step below.
      - name: Rust tests
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Downloader test
        run: node scripts/test-downloader.mjs
