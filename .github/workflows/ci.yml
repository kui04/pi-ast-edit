name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Job-level permissions flow into the called workflow (per docs,
    # caller-declared permissions can only be maintained, never elevated).
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml
