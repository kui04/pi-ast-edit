name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.3)"
        required: true

permissions:
  contents: read

concurrency:
  # Serialize releases: never publish while another release run is active.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Shared checks (same suite as CI). The release job below needs this green.
  check:
    # Job-level permissions flow into the called workflow (per docs,
    # caller-declared permissions can only be maintained, never elevated).
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: fully static musl via nix. Deterministic (same flake as
          # local dev) and no rustup/musl-tools maintenance. Same asset names
          # as before, so existing caches re-download on the next tag.
          - os: ubuntu-latest
            nix: true
            asset: pi-ast-edit-linux-x64
          - os: ubuntu-24.04-arm
            nix: true
            asset: pi-ast-edit-linux-arm64
          # Windows: static CRT so no VC redist is needed on target machines.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: pi-ast-edit.exe
            asset: pi-ast-edit-win32-x64.exe
            rustflags: "-C target-feature=+crt-static"
          # macOS: rustup builds, one runner per arch.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bin: pi-ast-edit
            asset: pi-ast-edit-darwin-x64
            rustflags: ""
          - os: macos-14
            target: aarch64-apple-darwin
            bin: pi-ast-edit
            asset: pi-ast-edit-darwin-arm64
            rustflags: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # --- Linux: nix static build ---
      - name: Install Nix
        if: matrix.nix
        uses: nixbuild/nix-quick-install-action@v35
      - name: Build static binary with nix
        if: matrix.nix
        run: |
          out=$(nix build .#pi-ast-edit-static --print-out-paths)
          cp "$out/bin/pi-ast-edit" "${{ matrix.asset }}"
      - name: Verify static link
        if: matrix.nix
        run: file "${{ matrix.asset }}" | tee /dev/stderr | grep -qE "static-pie|statically"

      # --- Windows/macOS: rustup build ---
      - name: Install Rust toolchain (channel from rust-toolchain.toml)
        if: ${{ !matrix.nix }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo
        if: ${{ !matrix.nix }}
        uses: Swatinem/rust-cache@v2
      - name: Build release binary
        if: ${{ !matrix.nix }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Run tests
        if: ${{ !matrix.nix }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo test --target ${{ matrix.target }}
      - name: Rename asset
        if: ${{ !matrix.nix }}
        shell: bash
        run: cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${{ matrix.asset }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  # Publishes only when checks AND every build leg succeed: a failed leg
  # skips this job, so a partial release can never be published.
  release:
    needs: [check, build]
    # Only the release job needs write access: it creates the GitHub release.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          pattern: "pi-ast-edit-*"
          merge-multiple: true
          path: assets
      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: assets/*
